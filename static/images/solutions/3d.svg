  <line x1="100" y1="100" x2="150" y2="72" stroke="#ffffff" stroke-width="3"/>
  <!-- Orbit Rotation Arrows -->
  <path d="M35 100 A65 65 0 0 1 165 100" stroke="url(#tdGrad)" stroke-width="3" stroke-dasharray="6 4" fill="none"/>
  <polygon points="165,95 173,102 163,108" fill="#38bdf8"/>
